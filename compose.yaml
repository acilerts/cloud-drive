services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MONGO_PORT}:27017"
    volumes:
      - "mongo-data:/data/db"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
  
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT}:8025"

  users:
    build:
      context: .
      dockerfile: services/users/Dockerfile
    restart: unless-stopped
    environment:
      USERS_PORT: ${USERS_PORT}
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      CLIENT_BASE_URL: ${CLIENT_BASE_URL}
      DEFAULT_QUOTA_BYTES: ${DEFAULT_QUOTA_BYTES}
      CONFIRM_TTL: ${CONFIRM_TTL}
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private.pem
      JWT_TTL: ${JWT_TTL}
      OTP_TTL: ${OTP_TTL}
      PASSWORD_MAX_AGE: ${PASSWORD_MAX_AGE}
      MAX_LOGIN_FAILURES: ${MAX_LOGIN_FAILURES}
      LOCKOUT_DURATION: ${LOCKOUT_DURATION}
    volumes:
      - ./keys/jwt_private.pem:/run/secrets/jwt_private.pem:ro
    ports:
      - "127.0.0.1:${USERS_PORT}:${USERS_PORT}"
    depends_on:
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  mongo-data:
  minio-data:


