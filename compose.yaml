services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MONGO_PORT}:27017"
    volumes:
      - "mongo-data:/data/db"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
  
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT}:8025"

  users:
    build:
      context: .
      dockerfile: services/users/Dockerfile
    restart: unless-stopped
    environment:
      USERS_PORT: ${USERS_PORT}
      MONGO_URI: ${MONGO_URI}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      MAIL_FROM: ${MAIL_FROM}
      CLIENT_BASE_URL: ${CLIENT_BASE_URL}
      DEFAULT_QUOTA_BYTES: ${DEFAULT_QUOTA_BYTES}
      CONFIRM_TTL: ${CONFIRM_TTL}
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private.pem
      JWT_TTL: ${JWT_TTL}
      OTP_TTL: ${OTP_TTL}
      PASSWORD_MAX_AGE: ${PASSWORD_MAX_AGE}
      PASSWORD_MIN_AGE: ${PASSWORD_MIN_AGE:-}
      RESET_TTL: ${RESET_TTL:-}
      MAGIC_TTL: ${MAGIC_TTL:-}
      MAX_LOGIN_FAILURES: ${MAX_LOGIN_FAILURES}
      LOCKOUT_DURATION: ${LOCKOUT_DURATION}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      QUOTA_MAX_BYTES: ${QUOTA_MAX_BYTES:-}
    volumes:
      - ./keys/jwt_private.pem:/run/secrets/jwt_private.pem:ro
    ports:
      - "127.0.0.1:${USERS_PORT}:${USERS_PORT}"
    depends_on:
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_started


  files:
    build:
      context: .
      dockerfile: services/files/Dockerfile
    restart: unless-stopped
    environment:
      FILES_PORT: ${FILES_PORT}
      MONGO_URI: ${MONGO_URI}
      FILES_MONGO_DB: ${FILES_MONGO_DB}
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public.pem
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-cloud-drive}
      USERS_SERVICE_URL: http://users:${USERS_PORT}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
    volumes:
      - ./keys/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    ports:
      - "127.0.0.1:${FILES_PORT}:${FILES_PORT}"
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_started


  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    restart: unless-stopped
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT}
      USERS_SERVICE_URL: ${USERS_SERVICE_URL}
      FILES_SERVICE_URL: ${FILES_SERVICE_URL}
      NOTIFICATIONS_SERVICE_URL: ${NOTIFICATIONS_SERVICE_URL}
      CLIENT_DIR: /client
      TLS_ENABLED: ${TLS_ENABLED:-false}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-20}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-40}
      AUTH_RATE_LIMIT_RPM: ${AUTH_RATE_LIMIT_RPM:-20}
    ports:
      - "127.0.0.1:${GATEWAY_PORT}:${GATEWAY_PORT}"
    depends_on:
      - users


  cassandra:
    image: cassandra:5.0
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: cloud-drive
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  notifications:
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    restart: unless-stopped
    environment:
      NOTIFICATIONS_PORT: ${NOTIFICATIONS_PORT:-8084}
      CASSANDRA_HOSTS: cassandra
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-cloud_drive_notifications}
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public.pem
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
    volumes:
      - ./keys/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    ports:
      - "127.0.0.1:${NOTIFICATIONS_PORT:-8084}:${NOTIFICATIONS_PORT:-8084}"
    depends_on:
      cassandra:
        condition: service_healthy

volumes:
  mongo-data:
  minio-data:
  cassandra-data:


